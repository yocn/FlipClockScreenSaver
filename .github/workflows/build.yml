name: Build Windows screensaver
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with Visual C++
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tests\core_test.cpp /Fo:build\core_test.obj /Fe:build\core_test.exe
          if errorlevel 1 exit /b 1
          build\core_test.exe
          if errorlevel 1 exit /b 1
      - name: Check Windows screensaver lifecycle
        shell: pwsh
        run: ./tests/windows_smoke.ps1
      - name: Prepare package
        shell: pwsh
        run: |
          Copy-Item packaging/Install.* dist/
          Copy-Item README.md dist/
          Copy-Item -Recurse preview dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicFlipClock-Windows-x64
          path: dist/
